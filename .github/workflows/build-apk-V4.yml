name: Build IM Auto Reply V4 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK tools
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Locate or extract V4 project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle || -f settings.gradle.kts ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*V4*.zip' | head -n 1 || true)"
            if [[ -z "$ZIP_FILE" ]]; then
              echo "ERROR: Upload IMWhatsAppAutoReply_V4.zip or extract the project into repository root."
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/im-v4"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/im-v4"
            SETTINGS="$(find "$RUNNER_TEMP/im-v4" -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"
            PROJECT_DIR="$(dirname "$SETTINGS")"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Clean and build signed debug APK
        run: gradle -p "$PROJECT_DIR" clean :app:assembleDebug --stacktrace

      - name: Verify APK before upload
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "package: name='com.imintelligence.imautoreply.v4'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "application-label:'IM Auto Reply'" "$GITHUB_WORKSPACE/apk-badging.txt"
          cp "$APK" "$GITHUB_WORKSPACE/IM-Auto-Reply-V4.apk"
          ls -lh "$GITHUB_WORKSPACE/IM-Auto-Reply-V4.apk"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: IM-Auto-Reply-V4
          path: |
            IM-Auto-Reply-V4.apk
            apk-badging.txt
          if-no-files-found: error

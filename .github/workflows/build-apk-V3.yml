name: Build IM Auto Reply V3 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Locate or extract IM Auto Reply V3 project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "settings.gradle" || -f "settings.gradle.kts" ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f \( -iname '*WhatsApp*V3*.zip' -o -iname '*AutoReply*V3*.zip' -o -iname '*.zip' \) | head -n 1 || true)"
            if [[ -z "$ZIP_FILE" ]]; then
              echo "ERROR: No Gradle project at repository root and no V3 ZIP found."
              echo "Upload IMWhatsAppAutoReply_V3.zip or extract its contents into the repository root."
              exit 1
            fi
            mkdir -p "$RUNNER_TEMP/im-auto-reply-v3"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/im-auto-reply-v3"
            SETTINGS_FILE="$(find "$RUNNER_TEMP/im-auto-reply-v3" -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1 || true)"
            if [[ -z "$SETTINGS_FILE" ]]; then
              echo "ERROR: ZIP does not contain settings.gradle/settings.gradle.kts."
              exit 1
            fi
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using Android project: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        shell: bash
        run: gradle -p "$PROJECT_DIR" :app:assembleDebug --stacktrace

      - name: Prepare APK artifact
        shell: bash
        run: |
          set -e
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/IM-Auto-Reply-V3.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IM-Auto-Reply-V3
          path: IM-Auto-Reply-V3.apk
          if-no-files-found: error

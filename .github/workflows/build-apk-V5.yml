name: Build IM Auto Reply V5 APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Locate or extract V5 project
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f settings.gradle || -f settings.gradle.kts ]]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$(find "$GITHUB_WORKSPACE" -maxdepth 2 -type f -iname '*V5*.zip' | head -n 1 || true)"
            if [[ -z "$ZIP_FILE" ]]; then
              echo "ERROR: IMWhatsAppAutoReply_V5.zip not found."
              exit 1
            fi
            rm -rf "$RUNNER_TEMP/im-v5"
            mkdir -p "$RUNNER_TEMP/im-v5"
            unzip -q "$ZIP_FILE" -d "$RUNNER_TEMP/im-v5"
            SETTINGS="$(find "$RUNNER_TEMP/im-v5" -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)"
            test -n "$SETTINGS"
            PROJECT_DIR="$(dirname "$SETTINGS")"
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Project: $PROJECT_DIR"

      - name: Pre-build V5 source audit
        shell: bash
        run: |
          set -euo pipefail
          grep -q "namespace 'com.imintelligence.imautoreply.v5'" "$PROJECT_DIR/app/build.gradle"
          grep -q "applicationId 'com.imintelligence.imautoreply.v5'" "$PROJECT_DIR/app/build.gradle"
          if grep -R -nE 'com\.imintelligence\.whatsappautoreply|com\.imintelligence\.imautoreply\.v4' "$PROJECT_DIR/app/src/main/java"; then
            echo "ERROR: stale package/R reference detected"
            exit 1
          fi
          grep -R -L 'package com.imintelligence.imautoreply.v5;' "$PROJECT_DIR/app/src/main/java" --include='*.java' && exit 1 || true
          echo "V5 source audit passed."

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Clean and build signed debug APK
        run: gradle -p "$PROJECT_DIR" clean :app:assembleDebug --stacktrace

      - name: Verify APK before upload
        shell: bash
        run: |
          set -euo pipefail
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK" | tee "$GITHUB_WORKSPACE/apk-signature.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "package: name='com.imintelligence.imautoreply.v5'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "application-label:'IM Auto Reply'" "$GITHUB_WORKSPACE/apk-badging.txt"
          grep -q "targetSdkVersion:'35'" "$GITHUB_WORKSPACE/apk-badging.txt"
          cp "$APK" "$GITHUB_WORKSPACE/IM-Auto-Reply-V5.apk"
          ls -lh "$GITHUB_WORKSPACE/IM-Auto-Reply-V5.apk"
          echo "APK verification PASSED."

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: IM-Auto-Reply-V5
          path: |
            IM-Auto-Reply-V5.apk
            apk-badging.txt
            apk-signature.txt
          if-no-files-found: error

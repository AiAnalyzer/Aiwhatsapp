name: Build IM Auto Reply V6

on:
  workflow_dispatch:
  push:
    paths:
      - 'IMWhatsAppAutoReply_V6.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Locate or extract V6 project
        shell: bash
        run: |
          set -e
          if [ -f "settings.gradle" ] || [ -f "settings.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          elif [ -f "IMWhatsAppAutoReply_V6.zip" ]; then
            rm -rf "$RUNNER_TEMP/im-v6"
            mkdir -p "$RUNNER_TEMP/im-v6"
            unzip -q "IMWhatsAppAutoReply_V6.zip" -d "$RUNNER_TEMP/im-v6"
            SETTINGS_FILE=$(find "$RUNNER_TEMP/im-v6" -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
            if [ -z "$SETTINGS_FILE" ]; then
              echo "No settings.gradle found inside IMWhatsAppAutoReply_V6.zip"
              exit 1
            fi
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          else
            echo "Upload IMWhatsAppAutoReply_V6.zip to the repository root, or extract the Android project into the repository root."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Android project: $PROJECT_DIR"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        shell: bash
        run: |
          gradle -p "$PROJECT_DIR" --no-daemon --stacktrace clean :app:assembleDebug

      - name: Verify and prepare APK
        shell: bash
        run: |
          set -e
          APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/apk-badging.txt"
          grep -q "package: name='com.imintelligence.imautoreply.v6'" "$RUNNER_TEMP/apk-badging.txt"
          grep -q "application-label:'IM Auto Reply'" "$RUNNER_TEMP/apk-badging.txt"
          mkdir -p "$RUNNER_TEMP/im-v6-output"
          cp "$APK" "$RUNNER_TEMP/im-v6-output/IM-Auto-Reply-V6.apk"
          cp "$RUNNER_TEMP/apk-badging.txt" "$RUNNER_TEMP/im-v6-output/apk-badging.txt"

      - name: Upload verified APK
        uses: actions/upload-artifact@v4
        with:
          name: IM-Auto-Reply-V6
          path: ${{ runner.temp }}/im-v6-output/
          if-no-files-found: error
          retention-days: 30

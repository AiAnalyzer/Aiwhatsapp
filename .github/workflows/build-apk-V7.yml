name: Build IM Auto Reply V7

on:
  workflow_dispatch:
  push:
    paths:
      - 'IMWhatsAppAutoReply_V7.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Extract V7 project
        shell: bash
        run: |
          set -e
          test -f IMWhatsAppAutoReply_V7.zip
          rm -rf "$RUNNER_TEMP/im-v7"
          mkdir -p "$RUNNER_TEMP/im-v7"
          unzip -q IMWhatsAppAutoReply_V7.zip -d "$RUNNER_TEMP/im-v7"
          SETTINGS_FILE=$(find "$RUNNER_TEMP/im-v7" -type f -name settings.gradle | head -n 1)
          test -n "$SETTINGS_FILE"
          echo "PROJECT_DIR=$(dirname "$SETTINGS_FILE")" >> "$GITHUB_ENV"
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build unsigned release APK
        shell: bash
        run: gradle -p "$PROJECT_DIR" --no-daemon --stacktrace clean :app:assembleRelease
      - name: Align and explicitly sign APK
        shell: bash
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="$PROJECT_DIR/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -f "$UNSIGNED"
          OUT="$RUNNER_TEMP/im-v7-output"
          mkdir -p "$OUT"
          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$OUT/IM-Auto-Reply-V7-aligned.apk"
          keytool -genkeypair -v -keystore "$RUNNER_TEMP/im-v7.keystore" -storepass imautoreplyv7 -keypass imautoreplyv7 -alias imautoreply -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=IM Auto Reply, OU=IM Intelligence, O=IM Intelligence, L=Dubai, ST=Dubai, C=AE"
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/im-v7.keystore" --ks-key-alias imautoreply --ks-pass pass:imautoreplyv7 --key-pass pass:imautoreplyv7 --v1-signing-enabled true --v2-signing-enabled true --v3-signing-enabled true --out "$OUT/IM-Auto-Reply-V7.apk" "$OUT/IM-Auto-Reply-V7-aligned.apk"
          rm "$OUT/IM-Auto-Reply-V7-aligned.apk"
      - name: Verify final APK
        shell: bash
        run: |
          set -e
          BT="$ANDROID_HOME/build-tools/35.0.0"
          APK="$RUNNER_TEMP/im-v7-output/IM-Auto-Reply-V7.apk"
          "$BT/zipalign" -c -v 4 "$APK" | tee "$RUNNER_TEMP/im-v7-output/zipalign-verification.txt"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "$RUNNER_TEMP/im-v7-output/signature-verification.txt"
          "$BT/aapt" dump badging "$APK" | tee "$RUNNER_TEMP/im-v7-output/apk-badging.txt"
          grep -q "package: name='com.imintelligence.imautoreply.v7'" "$RUNNER_TEMP/im-v7-output/apk-badging.txt"
          grep -q "application-label:'IM Auto Reply'" "$RUNNER_TEMP/im-v7-output/apk-badging.txt"
          grep -q "Verified using v2 scheme.*true" "$RUNNER_TEMP/im-v7-output/signature-verification.txt"
      - name: Upload V7 APK and verification reports
        uses: actions/upload-artifact@v4
        with:
          name: IM-Auto-Reply-V7
          path: ${{ runner.temp }}/im-v7-output/
          if-no-files-found: error
          retention-days: 30

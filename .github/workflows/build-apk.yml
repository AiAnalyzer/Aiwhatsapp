name: Build IM Auto Reply V8

on:
  workflow_dispatch:
  push:
    paths:
      - 'IMWhatsAppAutoReply_V8.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Locate or extract V8 project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f settings.gradle ] || [ -f settings.gradle.kts ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          elif [ -f IMWhatsAppAutoReply_V8.zip ]; then
            rm -rf "$RUNNER_TEMP/im-v8"
            mkdir -p "$RUNNER_TEMP/im-v8"
            unzip -q IMWhatsAppAutoReply_V8.zip -d "$RUNNER_TEMP/im-v8"
            SETTINGS_FILE=$(find "$RUNNER_TEMP/im-v8" -type f \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)
            test -n "$SETTINGS_FILE"
            PROJECT_DIR=$(dirname "$SETTINGS_FILE")
          else
            echo "No Android project or IMWhatsAppAutoReply_V8.zip found."
            exit 1
          fi
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Using project: $PROJECT_DIR"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build standard debug and unsigned release APKs
        shell: bash
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" --no-daemon --stacktrace clean :app:assembleDebug :app:assembleRelease

      - name: Prepare and sign V8 release APK
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED="$PROJECT_DIR/app/build/outputs/apk/release/app-release-unsigned.apk"
          DEBUG_APK="$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$UNSIGNED"
          test -f "$DEBUG_APK"

          OUT="$RUNNER_TEMP/im-v8-output"
          mkdir -p "$OUT"

          # Preserve a normal AGP-generated debug APK as an alternate installable build.
          cp "$DEBUG_APK" "$OUT/IM-Auto-Reply-V8-DEBUG.apk"

          "$BT/zipalign" -f -p 4 "$UNSIGNED" "$OUT/IM-Auto-Reply-V8-aligned.apk"

          keytool -genkeypair -v \
            -keystore "$RUNNER_TEMP/im-v8.keystore" \
            -storepass imautoreplyv8 \
            -keypass imautoreplyv8 \
            -alias imautoreply \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=IM Auto Reply, OU=IM Intelligence, O=IM Intelligence, L=Dubai, ST=Dubai, C=AE"

          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/im-v8.keystore" \
            --ks-key-alias imautoreply \
            --ks-pass pass:imautoreplyv8 \
            --key-pass pass:imautoreplyv8 \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$OUT/IM-Auto-Reply-V8.apk" \
            "$OUT/IM-Auto-Reply-V8-aligned.apk"

          rm "$OUT/IM-Auto-Reply-V8-aligned.apk"

      - name: Verify both V8 APKs
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          OUT="$RUNNER_TEMP/im-v8-output"

          for APKNAME in IM-Auto-Reply-V8.apk IM-Auto-Reply-V8-DEBUG.apk; do
            APK="$OUT/$APKNAME"
            test -s "$APK"
            BASE="${APKNAME%.apk}"
            "$BT/zipalign" -c -v 4 "$APK" > "$OUT/${BASE}-zipalign.txt"
            "$BT/apksigner" verify --verbose --print-certs "$APK" > "$OUT/${BASE}-signature.txt"
            "$BT/aapt" dump badging "$APK" > "$OUT/${BASE}-badging.txt"
            grep -q "package: name='com.imintelligence.imautoreply'" "$OUT/${BASE}-badging.txt"
            grep -q "versionCode='8'" "$OUT/${BASE}-badging.txt"
            grep -q "application-label:'IM Auto Reply'" "$OUT/${BASE}-badging.txt"
            grep -q "launchable-activity: name='com.imintelligence.imautoreply.MainActivity'" "$OUT/${BASE}-badging.txt"
            grep -q "Verified using v2 scheme.*true" "$OUT/${BASE}-signature.txt"
          done

          printf 'V8 verification passed\nPermanent package: com.imintelligence.imautoreply\nVersion: 8.0 (8)\n' > "$OUT/README-FIRST.txt"

      - name: Upload verified V8 APKs
        uses: actions/upload-artifact@v4
        with:
          name: IM-Auto-Reply-V8
          path: ${{ runner.temp }}/im-v8-output/
          if-no-files-found: error
          retention-days: 30
